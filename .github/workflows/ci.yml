name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm knip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm size

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build-storybook

  lighthouse:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /text-messenger
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Use Playwright Chromium for Lighthouse
        run: echo "CHROME_PATH=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_ENV"
      # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces for binaries without a profile,
      # so Playwright Chromium cannot start its sandbox; lift the restriction instead of --no-sandbox.
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    env:
      APP_PORT: 3200
      BASE_PATH: /text-messenger
      E2E_BASE_URL: http://localhost:3200/text-messenger/
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm exec playwright install --with-deps chromium
      - name: Write compose env
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "REAL_MODE_ENABLED=false"
            echo "APP_PORT=$APP_PORT"
          } > .env
      - run: docker compose up -d --build --wait
      - run: pnpm test:e2e
      - run: pnpm test:visual
      - if: ${{ failure() }}
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            compose.log
          retention-days: 7
